# Rules on which the two official validators of the conformance corpus
# disagree (tools/zugferd/run.py, tests/TESTING.md):
#
#   Mustang 2.14.0: the XSD and Schematron of Factur-X 1.0.07 (ZUGFeRD 2.3),
#     the EN 16931 Schematron it bundles and the XRechnung Schematron.
#   KoSIT 1.6.3 with the XRechnung configuration 2026-08-31: CEN Schematron
#     1.3.16 and XRechnung Schematron 2.6.0, the reference for XRechnung. It
#     has no scenario for MINIMUM, BASIC WL and BASIC.
#
# An e-invoice is officially valid only when the XSD, Mustang and KoSIT all
# accept it, and invoice-pro must report an error whenever one of them
# rejects it: otherwise the case is a FALSE_NEGATIVE. When only one of them
# rejects a document, every rule behind the disagreement is listed here with
# the validator that rejects it, what the other one reports and why they
# differ. An unlisted rule fails the run (OFFICIAL_DISAGREE), and so does a
# listed rule that no case of a full run shows any more, so that the list
# stays true. Every entry has a regression case that shows it
# (tools/zugferd/corpus/regression/); a run without the regression cases does
# not check the list.
#
#   rejected-by  the validator that reports an error: "mustang" or "kosit"
#   other        what the other validator reports: "warning" or "nothing",
#                or a list of both when it depends on the document
#   reason       why they differ, and what invoice-pro does

# ---- Mustang rejects, KoSIT warns

["BR-DE-17"]
rejected-by = "mustang"
other = "warning"
reason = """XRechnung allows the document types (BT-3) 326, 380, 381, 384, 389, 875, 876 and 877 only. \
The XRechnung Schematron states the rule as a recommendation, which KoSIT reports as a warning; \
Mustang reports an error. invoice-pro reports an error; with `zugferd: auto` such an invoice is \
written as EN 16931."""

["BR-DE-19"]
rejected-by = "mustang"
other = "warning"
reason = """The IBAN of a SEPA credit transfer (BT-84) must be valid. A warning in the XRechnung \
Schematron and in KoSIT, an error in Mustang. invoice-pro reports an error: the amount could not be \
paid."""

["BR-DE-20"]
rejected-by = "mustang"
other = "warning"
reason = """The IBAN of the account a SEPA direct debit collects from (BT-91) must be valid. A \
warning in the XRechnung Schematron and in KoSIT, an error in Mustang. invoice-pro reports an error: \
the amount could not be collected."""

["BR-DE-26"]
rejected-by = "mustang"
other = "warning"
reason = """A corrected invoice (BT-3 = 384) names the invoice it corrects (BG-3). A warning in the \
XRechnung Schematron and in KoSIT, an error in Mustang. invoice-pro reports an error, as the VAT \
Directive (Art. 219) requires the reference."""

["BR-DE-27"]
rejected-by = "mustang"
other = "warning"
reason = """The phone number of the seller contact (BT-42) has at least three digits. A warning in \
the XRechnung Schematron and in KoSIT, an error in Mustang. invoice-pro reports an error (maintainer \
decision): stricter than KoSIT."""

["CII-SR-449"]
rejected-by = "mustang"
other = "warning"
reason = """The deliver-to location has one identifier (BT-71): `ram:ID` or `ram:GlobalID`. The CEN \
Schematron flags the rule as a warning, which KoSIT reports as such; Mustang reports every failed \
assertion of the CEN Schematron as an error. invoice-pro reports an error: it cannot tell which of \
the two identifiers to state."""

["CII-SR-450"]
rejected-by = "mustang"
other = "warning"
reason = """The buyer has one identifier (BT-46): `ram:ID` or `ram:GlobalID`. A warning in the CEN \
Schematron and in KoSIT, an error in Mustang (see CII-SR-449). invoice-pro reports an error."""

# ---- Mustang rejects, KoSIT reports nothing

["BR-AG-05"]
rejected-by = "mustang"
other = "nothing"
reason = """The rate of an IPSI line (category M): CEN Schematron 1.3.12 in Mustang requires a rate \
above zero, CEN 1.3.16 in KoSIT accepts zero as well. invoice-pro reports an error, like Mustang."""

["BR-CL-03"]
rejected-by = "mustang"
other = "nothing"
reason = """The currency of an amount (currencyID). The code lists of CEN Schematron 1.3.12 in \
Mustang lack the current bolivar (VES), those of CEN 1.3.16 in KoSIT have it. invoice-pro follows \
Mustang: an e-invoice of the EN 16931 profiles in VES is an error (see BR-CL-04)."""

["BR-CL-04"]
rejected-by = "mustang"
other = "nothing"
reason = """The invoice currency (BT-5): the same difference of the code lists as BR-CL-03. \
invoice-pro reports an error."""

["BR-CO-25"]
rejected-by = "mustang"
other = "nothing"
reason = """An amount due needs a payment due date (BT-9) or payment terms (BT-20). The CII \
Schematron of CEN 1.3.16 in KoSIT no longer checks BR-CO-25 \
(https://github.com/ConnectingEurope/eInvoicing-EN16931/issues/477); the Factur-X 1.0.07 \
Schematron in Mustang does (FX-SCH-A-000155). invoice-pro follows Factur-X and reports an error."""

["BR-DE-28"]
rejected-by = "mustang"
other = "nothing"
reason = """The e-mail address of the seller contact (BT-43). The XRechnung Schematron 2.6.0 in KoSIT \
checks it with a pattern that accepts internationalized domains, and only warns; the older \
XRechnung Schematron in Mustang has a pattern of ASCII characters and reports an error. \
invoice-pro applies the ASCII pattern as an error (maintainer decision): stricter than KoSIT; a \
domain with umlauts is written in punycode."""

# ---- KoSIT rejects, Mustang reports nothing

["CII-SR-467"]
rejected-by = "kosit"
other = "nothing"
reason = """All payment means of an invoice have the same type code (BT-81). The rule is newer than \
CEN Schematron 1.3.12 in Mustang; KoSIT (CEN 1.3.16) reports an error. invoice-pro states one \
payment means and reports two different ones as IP-PAY-03."""

["CII-SR-470"]
rejected-by = "kosit"
other = "nothing"
reason = """A credit transfer names the account by its IBAN or a proprietary ID (BT-84). The rule is \
newer than CEN Schematron 1.3.12 in Mustang, whose CII variant of BR-61 tests the debited account \
instead; KoSIT (CEN 1.3.16) reports an error. invoice-pro reports BR-61."""
