# Rules on which the two official validators of the conformance corpus
# disagree (tools/zugferd/run.py, tests/TESTING.md):
#
#   Mustang 2.26.0: the XSD and Schematron of Factur-X 1.09.2 (ZUGFeRD 2.5.2),
#     the CEN Schematron 1.3.16 it bundles and the XRechnung Schematron
#     3.0.2. It reports the assertions flagged as warnings as warnings.
#   KoSIT 1.6.3 with the XRechnung configuration 2026-08-31: CEN Schematron
#     1.3.16 and XRechnung Schematron 2.6.0, the reference for XRechnung. It
#     has no scenario for MINIMUM, BASIC WL and BASIC.
#
# An e-invoice is officially valid only when the XSD, Mustang and KoSIT all
# accept it, and invoice-pro must report an error whenever one of them
# rejects it: otherwise the case is a FALSE_NEGATIVE, unless the maintainer
# decided that invoice-pro only warns (`warned-as`). When only one of them
# rejects a document, every rule behind the disagreement is listed here with
# the validator that rejects it, what the other one reports and why they
# differ. An unlisted rule fails the run (OFFICIAL_DISAGREE), and so does a
# listed rule that no case shows any more in a run of all regression cases
# and parity fixtures, so that the list stays true. Every entry has a
# regression case (tools/zugferd/corpus/regression/) or a parity fixture
# (tools/zugferd/corpus/rules/) that shows it; a run without all of them
# (`--only`, `--population` or single case files) does not check the list.
#
#   rejected-by  the validator that reports an error: "mustang" or "kosit",
#                or a list of both when it depends on the document (e.g. on
#                a code that only the code list of one of them has)
#   other        what the other validator reports: "warning" or "nothing",
#                or a list of both when it depends on the document
#   reason       why they differ, and what invoice-pro does
#   warned-as    optional: the rule of invoice-pro that warns, as the
#                maintainer decided, where it accepts what only the
#                rejecting validator rejects; such a case is WARNED rather
#                than a FALSE_NEGATIVE (tools/zugferd/run.py)

# ---- Code lists: the lists of the validators differ, so either one may
# ---- reject a code that the other one accepts without a message
#
# Mustang checks the codes with the lists of CEN Schematron 1.3.12 and of
# Factur-X 1.0.07 (XRechnung: of CEN 1.3.12 alone), KoSIT with those of CEN
# Schematron 1.3.16. The newer lists have codes the older ones lack, and have
# withdrawn codes the older ones still have; the Factur-X lists lack a few
# codes the CEN lists have (e.g. the scheme 0219). invoice-pro accepts only
# the codes that every list the validation of a profile applies contains
# (the code lists of the validator, which tools/zugferd/gen_guard.py
# intersects: src/zugferd/code-lists.json, read by
# src/zugferd/code-lists.typ), and reports an error for any other, under the
# rule of a validator that rejects it (`code-finding` of
# src/zugferd/rules/rare.typ).

["BR-CL-03"]
rejected-by = ["mustang", "kosit"]
other = "nothing"
warned-as = "IP-CODE-01"
reason = """The currency of an amount (currencyID) is in the ISO 4217 list of the EN 16931 \
Schematron. CEN 1.3.12 in Mustang lacks newer codes such as the current bolivar (VES), which CEN \
1.3.16 in KoSIT has; CEN 1.3.16 has withdrawn codes such as the Bulgarian lev (BGN, the euro since \
2026) and the Croatian kuna (HRK), which CEN 1.3.12 still has. invoice-pro reports a newer code as \
BR-CL-04. A withdrawn code that the Factur-X list has is allowed in EN 16931 (and BASIC, which \
KoSIT does not validate), as the Factur-X validation accepts it: invoice-pro warns of it \
(IP-CODE-01, a maintainer decision; the case is WARNED), and reports it in XRechnung as BR-CL-04."""

["BR-CL-04"]
rejected-by = ["mustang", "kosit"]
other = "nothing"
warned-as = "IP-CODE-01"
reason = """The invoice currency (BT-5): the same difference of the code lists as BR-CL-03. \
invoice-pro reports an error, but warns of a withdrawn currency in EN 16931 (IP-CODE-01)."""

["BR-CL-10"]
rejected-by = "mustang"
other = "nothing"
reason = """The scheme of a party identifier (BT-29, BT-46) is in the ISO/IEC 6523 ICD list. CEN \
1.3.16 in KoSIT has newer codes (0231 to 0248) that the lists of CEN 1.3.12 and Factur-X 1.0.07 in \
Mustang lack. invoice-pro follows Mustang and reports an error."""

["BR-CL-11"]
rejected-by = "mustang"
other = "nothing"
reason = """The scheme of a legal registration identifier (BT-30, BT-47): the same difference of \
the ICD lists as BR-CL-10. invoice-pro reports an error."""

["BR-CL-25"]
rejected-by = ["mustang", "kosit"]
other = "nothing"
reason = """The scheme of an electronic address (BT-34, BT-49) is in the EAS code list. CEN 1.3.16 \
in KoSIT has newer schemes (e.g. 0240) that CEN 1.3.12 and Factur-X 1.0.07 in Mustang lack, and it \
has withdrawn 9901, which they still have. invoice-pro reports both kinds as an error."""

["FX-SCH-A-000031"]
rejected-by = "mustang"
other = "nothing"
reason = """The Factur-X 1.0.07 Schematron in Mustang checks every scheme identifier (`@schemeID`) \
with its own lists, which lack the newer ICD and EAS codes of CEN 1.3.16 (see BR-CL-10 and \
BR-CL-25) and the EAS schemes 0219 and 0220, which both CEN lists have; KoSIT has no Factur-X \
rules. invoice-pro reports the rule of the CEN list for a newer code (BR-CL-10, BR-CL-11 or \
BR-CL-25), which CEN 1.3.12 in Mustang lacks as well, and FX-SCH-A-000031 for 0219 and 0220, \
which XRechnung accepts."""

["FX-SCH-A-000040"]
rejected-by = "mustang"
other = "nothing"
reason = """The invoice currency (BT-5) is in the Factur-X 1.0.07 list, which lacks the newest ISO \
4217 codes that CEN 1.3.16 in KoSIT has, e.g. the Caribbean guilder (XCG), Zimbabwe Gold (ZWG) \
and the digital bolivar (VED), and the São Tomé dobra of before 2018 (STD), which both CEN lists \
have; KoSIT has no Factur-X rules. invoice-pro reports BR-CL-04 for a newer code, which CEN 1.3.12 \
in Mustang lacks as well, and FX-SCH-A-000040 for STD, which XRechnung accepts."""

["FX-SCH-A-000045"]
rejected-by = "mustang"
other = "nothing"
reason = """The currency of an amount (`@currencyID`): the same Factur-X list as FX-SCH-A-000040. \
invoice-pro reports the rule of the invoice currency (BR-CL-04 or FX-SCH-A-000040)."""

["BR-CL-22"]
rejected-by = "mustang"
other = "nothing"
reason = """The VAT exemption reason code (BT-121) is in the VATEX code list. CEN 1.3.16 in KoSIT \
has newer codes (e.g. VATEX-EU-144) that the lists of CEN 1.3.12 and Factur-X 1.0.07 in Mustang \
lack. invoice-pro follows Mustang and reports BR-CL-22."""

["FX-SCH-A-000181"]
rejected-by = "mustang"
other = "nothing"
reason = """The VAT exemption reason code (BT-121) in the Factur-X 1.0.07 list: the same difference \
of the code lists as BR-CL-22; KoSIT has no Factur-X rules. invoice-pro reports BR-CL-22."""

["FX-SCH-A-000036"]
rejected-by = "mustang"
other = "nothing"
reason = """A country code of an address (BT-40, BT-55, BT-69, BT-80) in the Factur-X 1.0.07 list, \
which lacks the Netherlands Antilles (AN), which both CEN lists still have; KoSIT has no Factur-X \
rules. invoice-pro reports FX-SCH-A-000036 in the Factur-X profiles; XRechnung accepts the code."""

["FX-SCH-A-000026"]
rejected-by = "mustang"
other = "nothing"
reason = """The country of origin of an item (BT-159): the same Factur-X list as FX-SCH-A-000036, \
which lacks AN. invoice-pro reports FX-SCH-A-000026 in EN 16931; XRechnung accepts the code."""
