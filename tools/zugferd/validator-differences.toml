# Rules on which the two official validators of the conformance corpus
# disagree (tools/zugferd/run.py, tests/TESTING.md):
#
#   Mustang 2.26.0: the XSD and Schematron of Factur-X 1.09.2 (ZUGFeRD 2.5.2),
#     the CEN Schematron 1.3.16 it bundles and the XRechnung Schematron
#     3.0.2. It reports the assertions flagged as warnings as warnings.
#   KoSIT 1.6.3 with the XRechnung configuration 2026-08-31: CEN Schematron
#     1.3.16 and XRechnung Schematron 2.6.0, the reference for XRechnung. It
#     has no scenario for MINIMUM, BASIC WL and BASIC.
#
# An e-invoice is officially valid only when the XSD, Mustang and KoSIT all
# accept it, and invoice-pro must report an error whenever one of them
# rejects it: otherwise the case is a FALSE_NEGATIVE, unless the maintainer
# decided that invoice-pro only warns (`warned-as`). When only one of them
# rejects a document, every rule behind the disagreement is listed here with
# the validator that rejects it, what the other one reports and why they
# differ. An unlisted rule fails the run (OFFICIAL_DISAGREE), and so does a
# listed rule that no case shows any more in a run of all regression cases
# and parity fixtures, so that the list stays true. Every entry has a
# regression case (tools/zugferd/corpus/regression/) or a parity fixture
# (tools/zugferd/corpus/rules/) that shows it; a run without all of them
# (`--only`, `--population` or single case files) does not check the list.
#
#   rejected-by  the validator that reports an error: "mustang" or "kosit",
#                or a list of both when it depends on the document (e.g. on
#                a code that only the code list of one of them has)
#   other        what the other validator reports: "warning" or "nothing",
#                or a list of both when it depends on the document
#   reason       why they differ, and what invoice-pro does
#   warned-as    optional: the rule of invoice-pro that warns, as the
#                maintainer decided, where it accepts what only the
#                rejecting validator rejects; such a case is WARNED rather
#                than a FALSE_NEGATIVE (tools/zugferd/run.py)

# ---- Only KoSIT rejects: the CEN Schematron, which Mustang 2.26.0 does not
# ---- apply to EN 16931 (the Factur-X 1.09 Schematron states the business
# ---- rules itself)

["BR-17"]
rejected-by = "kosit"
other = "nothing"
reason = """A payee (BG-10) is someone other than the seller. The Factur-X Schematron, which Mustang \
applies to EN 16931, compares the payee with a path of the seller that never matches; the CEN \
Schematron of KoSIT checks it. invoice-pro reports BR-17 in EN 16931 and XRechnung, and its own \
IP-PAY-05 in BASIC WL and BASIC, which KoSIT does not validate."""

["BR-CL-14"]
rejected-by = "kosit"
other = "nothing"
reason = """A country code in the ISO 3166-1 list of EN 16931. The Factur-X list, which Mustang \
applies to EN 16931, also has South Sudan (SS); the CEN list of KoSIT does not. invoice-pro reports \
BR-CL-14 in EN 16931 and accepts SS in MINIMUM, BASIC WL and BASIC, whose validation applies the \
Factur-X list alone."""

# ---- Only Mustang rejects: the code lists of Factur-X, which lack a few codes
# ---- of the CEN lists. Since Factur-X 1.09, each position of each profile has
# ---- a rule id of its own (`fx-rules` of src/zugferd/code-lists.json); KoSIT
# ---- has no Factur-X rules. invoice-pro reports the rule of the Factur-X
# ---- Schematron of the position (`code-finding` of src/zugferd/rules/rare.typ),
# ---- and XRechnung, which Mustang validates with the CEN lists, accepts the
# ---- codes.

["FX-SCH-A-000568"]
rejected-by = "mustang"
other = "nothing"
reason = """The buyer country code (BT-55) in EN 16931 is in the Factur-X list, which lacks the \
Netherlands Antilles (AN), which the CEN list still has."""

["FX-SCH-A-000571"]
rejected-by = "mustang"
other = "nothing"
reason = """The scheme of the buyer electronic address (BT-49) in EN 16931 is in the Factur-X EAS \
list, which lacks the schemes 0219 and 0220 of the CEN list."""

["FX-SCH-A-000595"]
rejected-by = "mustang"
other = "nothing"
reason = """The invoice currency (BT-5) in EN 16931 is in the Factur-X list, which lacks the São \
Tomé dobra of before 2018 (STD), which the CEN list has."""

["FX-SCH-A-000606"]
rejected-by = "mustang"
other = "nothing"
reason = """The currency of an amount (`@currencyID`) in EN 16931: the same Factur-X list as \
FX-SCH-A-000595. invoice-pro reports the rule of the invoice currency."""

["FX-SCH-A-000628"]
rejected-by = "mustang"
other = "nothing"
reason = """The country of origin of an item (BT-159) in EN 16931 is in the Factur-X list, which \
lacks the Netherlands Antilles (AN), which the CEN list still has."""
