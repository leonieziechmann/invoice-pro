# How invoice-pro handles every rule id of the official validators.
#
# tools/zugferd/rule_coverage.py collects the rule ids of every profile from
# the pinned artefacts of Mustang and KoSIT and fails on any id without a
# class (see tests/TESTING.md, "Rule Coverage"). The compiler of the tables
# of the test oracle (gen_guard.py) settles most of them (`compiled`,
# `unreachable`); this file classifies the others:
#
#   [[rule]]
#   ids = ["BR-XX", ..]         rule ids as the validators report them
#   class = "fixture"           see below
#   profiles = ["en16931", ..]  optional: only these profiles
#   reason = "..."              why (all classes but a plain fixture)
#   evidence = ["path: ..."]    construction: the code path and its tests
#   reported-as = ["BR-YY"]     fixture: the related rule invoice-pro reports
#
#   fixture       invoice-pro reports the rule under its id: a parity
#                 fixture tools/zugferd/corpus/rules/<ID>.typ proves it
#                 against the validators of each profile of the entry
#                 (run.py), so it runs in each of them (its `// profiles:`
#                 header). With `reported-as`, invoice-pro reports a related
#                 rule that the validators report for the same invoice as
#                 well.
#   compiled      the test oracle checks the rule on the XML of every test
#                 invoice, although KoSIT's version of it differs from
#                 Mustang's (the reason says why the oracle covers it)
#   construction  the builder cannot produce the violation
#   unreachable   the rule cannot fire on an XML invoice-pro writes
#   open          not handled yet (the target is none; the work list
#                 OPEN_WORK_LIST of rule_coverage.py can only become shorter)
#
# invoice-pro's own rules, those the package reports, are listed at the end
# ([ip."IP-.."]) with their level, what they check, their basis and their
# tests, and so are the official rule ids src/ and the rule registry name
# that no parity fixture shows ([[without-fixture]]).

