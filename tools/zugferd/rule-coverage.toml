position under the id of the position and the profile (`fx-rules` of src/zugferd/code-lists.json, \
which gen_guard.py compiles from the Schematron of each profile), and the fixtures of \
tools/zugferd/corpus/rules/FX-SCH-A-*.typ show it at one position of each list. Until Factur-X \
1.0.07 these positions shared one id with the fixtures (e.g. FX-SCH-A-000031 for the schemes)."""

[[without-fixture]]
ids = ["BR-48"]
reason = """Cannot fire: every VAT constructor states a rate (0 % by default) and the model writes \
the rate of every VAT breakdown. The rules check it as a model defect and name the input; the test \
oracle checks the XML of every test invoice (FX-SCH-A-000050)."""

[[without-fixture]]
ids = ["BR-03"]
reason = """Cannot fire: `invoice` requires `date` to be a datetime, by default the day of the \
compilation."""

[[without-fixture]]
ids = ["BR-09", "BR-11", "BR-20", "BR-57"]
reason = """A safety net that cannot fire: a party or delivery address without `country` gets the \
country of the locale, so the country code is never missing."""

[[without-fixture]]
ids = ["BR-CO-04", "BR-DE-30"]
reason = """A safety net that cannot fire: every item has a VAT category (`tax: none` is written as \
zero rated, with IP-TAX-01), and `direct-debit` requires the creditor identifier (see the \
construction entries of these rules)."""

[[without-fixture]]
ids = ["BR-IC-12"]
reason = """A safety net that cannot fire: an intra-community supply without `delivery-address` is \
delivered to the buyer's address, so the deliver-to country (BT-80) is always written (see its \
construction entry)."""

# ======================================================================
# invoice-pro's own rules (IP-*): stricter than the official validators
# ======================================================================
#
# level    "error", "warning" or "error or warning"
# summary  what the rule checks
# basis    the law or the requirement it enforces
# tests    tests that name the rule

[ip."IP-PROFILE-01"]
level = "warning"
summary = "An input the profile cannot state is printed, but not written into the e-invoice."
basis = "Fidelity: the e-invoice states what the invoice prints, as far as the profile can."
tests = ["tests/zugferd/line-data/test.typ", "tests/zugferd/notes/test.typ"]

[ip."IP-TAX-01"]
level = "error"
summary = "`tax: none` in an e-invoice would declare the items as zero rated (Z)."
basis = "EN 16931 BT-151: every item states its VAT category, a decision the user has to make."
tests = ["tests/zugferd/vat-categories/test.typ", "tools/zugferd/corpus/regression/tax-none.typ"]

[ip."IP-TAX-02"]
level = "error"
summary = "A VAT exemption reason code (BT-121) of another VAT category."
basis = "CEF VATEX code list: each code belongs to a VAT category."
tests = ["tests/zugferd/exemption-codes/test.typ"]

[ip."IP-TAX-03"]
level = "warning"
summary = "Items of one VAT category and rate with different exemption reason codes."
basis = "EN 16931 BG-23: one exemption reason code per VAT group; the others are stated as text."
tests = ["tests/zugferd/exemption-codes/test.typ"]

[ip."IP-TAX-04"]
level = "error"
summary = "An exemption (E) with an exemption reason code but without `grounds` for the printed invoice."
basis = "§ 14 Abs. 4 Satz 1 Nr. 8 UStG; Art. 226 No. 11 of the VAT Directive 2006/112/EC."
tests = ["tests/zugferd/exemption-codes/test.typ"]

[ip."IP-TAX-05"]
level = "error"
summary = "A seller tax representative with a VAT identifier on an invoice not subject to VAT (O), in BASIC WL."
basis = """EN 16931 BR-O-02: items not subject to VAT exclude the seller tax representative VAT \
identifier (BT-63); BASIC WL states no lines, so its validation does not check it."""
tests = [
  "tests/zugferd/party-details/test.typ",
  "tools/zugferd/corpus/regression/tax-representative-outside-scope-basic-wl.typ",
]

[ip."IP-PRINT-02"]
level = "error"
summary = "Amounts printed in another currency than the invoice currency (BT-5)."
basis = "Fidelity: the e-invoice states the amounts the invoice prints, in its currency (Art. 230 VAT Directive)."
tests = ["tests/zugferd/currency/test.typ", "tools/zugferd/corpus/regression/custom-locale-currency-format-only.typ"]

[ip."IP-PRINT-03"]
level = "error"
summary = "The printed invoice shows neither the seller's VAT identifier nor its tax number, which the XML states."
basis = "§ 14 Abs. 4 Satz 1 Nr. 2 UStG; Art. 226 No. 3 of the VAT Directive 2006/112/EC."
tests = ["tests/zugferd/printed/test.typ"]

[ip."IP-DOC-01"]
level = "error"
summary = "A subject that names another kind of document than an invoice, without `document-type`."
basis = "EN 16931 BT-3: the document type states what the document is (a commercial invoice asks for payment)."
tests = ["tests/zugferd/document-type/test.typ", "tools/zugferd/corpus/regression/quote-subject.typ"]

[ip."IP-DOC-02"]
level = "error"
summary = "A corrected invoice without `preceding-invoice-nr`."
basis = "Art. 219 of the VAT Directive 2006/112/EC: a corrected invoice refers to the invoice it amends."
tests = ["tests/zugferd/preceding-invoice/test.typ"]

[ip."IP-DOC-03"]
level = "error"
summary = "A credit note with a negative total, which would ask the buyer to pay."
basis = "EN 16931 BT-3 (381): a credit note states the credited amounts as positive amounts."
tests = ["tests/zugferd/document-type/test.typ", "tools/zugferd/corpus/regression/credit-note-negative.typ"]

[ip."IP-DOC-04"]
level = "warning"
summary = "An invoice with a negative total."
basis = "EN 16931 BT-3: a credit note (381) is the document for a credit."
tests = ["tests/zugferd/document-type/test.typ"]

[ip."IP-DOC-05"]
level = "error"
summary = "A preceding invoice date (BT-26) without the number of the preceding invoice (BT-25)."
basis = """Fidelity: the builder writes the preceding invoice reference (BG-3) with its number only, as \
BR-55 requires, so the printed date would be missing from the e-invoice."""
tests = ["tests/zugferd/preceding-invoice/test.typ"]

[ip."IP-PERIOD-01"]
level = "error or warning"
summary = "A printed service period that is not the one the XML states."
basis = "§ 14 Abs. 4 Satz 1 Nr. 6 UStG: the date of the supply; the e-invoice states the printed one."
tests = [
  "tests/zugferd/service-period/test.typ",
  "tools/zugferd/corpus/regression/service-period-printed-date-contradicts.typ",
]

[ip."IP-PERIOD-02"]
level = "warning"
summary = "The date of an item outside the `service-period` of the invoice (outside XRechnung)."
basis = "Plausibility; XRechnung checks it as PEPPOL-EN16931-R110 and R111."
tests = ["tests/zugferd/line-data/test.typ"]

[ip."IP-PERIOD-03"]
level = "error or warning"
summary = "The printed invoice does not show the date of the supply."
basis = "§ 14 Abs. 4 Satz 1 Nr. 6 UStG (not for a small-amount invoice, § 33 UStDV)."
tests = ["tests/zugferd/printed/test.typ"]

[ip."IP-COUNTRY-01"]
level = "error"
summary = "A party without `country` whose VAT identifier was issued by another country than the default."
basis = "Fidelity: the country code (BT-40, BT-55) is the party's country, not the locale's."
tests = ["tests/zugferd/parties/test.typ"]

[ip."IP-ADDR-01"]
level = "error"
summary = "A city line with a number but no post code in the format of the party's country."
basis = "Fidelity: the post code (BT-38, BT-53) would be missing and written into the city name."
tests = ["tests/zugferd/parties/test.typ"]

[ip."IP-EADDR-01"]
level = "warning"
summary = "An EN 16931 invoice without the electronic address of the seller (BT-34) or the buyer (BT-49)."
basis = """Peppol BIS Billing 3.0 PEPPOL-EN16931-R020 and R010, which XRechnung applies: a delivery over \
Peppol needs both addresses; EN 16931 leaves them optional, and its validation checks neither."""
tests = ["tests/zugferd/validate/test.typ", "tests/issues/issue-29/test.typ"]

[ip."IP-ID-01"]
level = "error"
summary = "An identifier of the `id` module whose format or check digit is wrong."
basis = "The format and check digits of the identifier schemes (ISO/IEC 6523, Leitweg-ID)."
tests = ["tests/zugferd/identifiers/test.typ", "tools/zugferd/corpus/regression/legal-id-check-digit.typ"]

[ip."IP-ID-02"]
level = "error"
summary = "Two values for one party identifier, of which only one can be written."
basis = "Fidelity: EN 16931 states one identifier per scheme (BT-29, BT-46, BT-71); one value would be lost."
tests = ["tests/zugferd/parties/test.typ"]

[ip."IP-ID-03"]
level = "error"
summary = "An identifier given for a field it does not belong to (e.g. a Leitweg-ID as `legal-id`)."
basis = "The identifier schemes of EN 16931 (BT-10, BT-29, BT-30, BT-46, BT-47)."
tests = ["tests/zugferd/party-details/test.typ"]

[ip."IP-KEY-01"]
level = "warning"
summary = "A key of a party that invoice-pro does not know: its value is not written."
basis = "Fidelity: no input is dropped without notice."
tests = ["tests/zugferd/parties/test.typ"]

[ip."IP-KEY-02"]
level = "error"
summary = "A misspelled key the e-invoice reads, or another name of it (e.g. `vatId`)."
basis = "Fidelity: its value would be missing from the e-invoice without notice."
tests = ["tests/zugferd/parties/test.typ"]

[ip."IP-VAT-226"]
level = "error"
summary = """An intra-community supply (K) or cross-border reverse charge (AE) without the buyer VAT \
identifier the official rules miss, or a tax representative without address."""
basis = "Art. 226 No. 4 and No. 15 of the VAT Directive 2006/112/EC."
tests = ["tests/zugferd/vat-categories/test.typ", "tests/zugferd/parties/test.typ"]

[ip."IP-VAT-138"]
level = "warning"
summary = """An intra-community supply (K) delivered to the member state it is dispatched from, or to \
a buyer whose VAT identifier was not issued by an EU member state."""
basis = "Art. 138 of the VAT Directive 2006/112/EC."
tests = ["tests/zugferd/parties/test.typ", "tests/zugferd/parties-invoice/test.typ"]

[ip."IP-UNIT-01"]
level = "warning"
summary = "A unit code used verbatim that is also a common German abbreviation of another unit."
basis = "UN/ECE Recommendation 20: e.g. STK is no code for pieces."
tests = ["tests/zugferd/units/test.typ"]

[ip."IP-UNIT-02"]
level = "error"
summary = "A unit given as text that invoice-pro does not know, which the XML would state as one (C62)."
basis = """Fidelity: the unit code (BT-130, UN/ECE Recommendation 20) states what the quantity counts; \
"one" for a text such as "Nacht" would be a guess, which the validators accept."""
tests = ["tests/zugferd/units/test.typ", "tools/zugferd/corpus/regression/unit-text-unknown.typ"]

[ip."IP-DEC-01"]
level = "error"
summary = "A VAT rate with more than 4 decimals, which the XML cannot state exactly."
basis = "Fidelity: EN 16931 states the rate (BT-119, BT-152) as a percentage with up to 4 decimals."
tests = ["tests/zugferd/rates/test.typ"]

[ip."IP-DEC-02"]
level = "error"
summary = "An amount with more than 2 decimals, which the XML cannot state."
basis = """Fidelity: EN 16931 states amounts with 2 decimals (BR-DEC-*); the builder would write rounded \
amounts that are not the printed ones and no longer add up."""
tests = ["tests/zugferd/decimals/test.typ", "tools/zugferd/corpus/regression/money-three-decimals.typ"]

[ip."IP-CODE-01"]
level = "error or warning"
summary = "A code the newest EN 16931 code list has withdrawn, which the Factur-X validation of the profile accepts."
basis = """The EN 16931 code lists 1.3.16 (KoSIT) have withdrawn the code; a receiver that validates with the \
current lists rejects the e-invoice, as KoSIT does in EN 16931 and XRechnung (BR-CL-04, BR-CL-25). A \
currency (e.g. BGN) is allowed wherever the Factur-X validation accepts it, with a warning in BASIC and \
EN 16931 (maintainer decision of 2026-09-24); any other code (the scheme 9901) is deliberately rejected in \
BASIC WL and BASIC."""
tests = [
  "tests/zugferd/codelists/test.typ",
  "tools/zugferd/corpus/regression/currency-withdrawn-basic.typ",
  "tools/zugferd/corpus/regression/currency-withdrawn-from-en16931-list.typ",
  "tools/zugferd/corpus/regression/withdrawn-scheme-9901-basic-wl.typ",
]

[ip."IP-PAY-01"]
level = "error"
summary = "An IBAN with wrong check digits or format, where BR-DE-19 and BR-DE-20 do not check it."
basis = "ISO 13616 (IBAN): the amount could not be paid or collected."
tests = ["tests/zugferd/payment-means/test.typ"]

[ip."IP-PAY-02"]
level = "error"
summary = "A SEPA creditor identifier (BT-90) with wrong check digits or format."
basis = "The EPC's SEPA creditor identifier (ISO 7064 check digits)."
tests = ["tests/zugferd/payment-means/test.typ"]

[ip."IP-PAY-05"]
level = "error"
summary = "A payee that is the seller, in BASIC WL."
basis = """EN 16931 BR-17: the payee (BG-10) is someone other than the seller; the Factur-X Schematron \
of BASIC WL compares it with a path of the seller that never matches, so its validation does not \
check it."""
tests = ["tests/zugferd/party-details/test.typ", "tools/zugferd/corpus/regression/payee-is-seller-basic-wl.typ"]

[ip."IP-PAY-06"]
level = "error"
summary = "An amount due (BT-115) without a payment due date (BT-9) or payment terms (BT-20)."
basis = """BR-CO-25 of EN 16931, which the CII Schematron of CEN 1.3.16 and Factur-X 1.09 no longer \
check (https://github.com/ConnectingEurope/eInvoicing-EN16931/issues/477): without either, the \
buyer does not know when to pay (maintainer decision of 2026-09-30)."""
tests = ["tests/zugferd/validate/test.typ", "tools/zugferd/corpus/regression/payment-terms-missing.typ"]

[ip."IP-PREPAID-01"]
level = "warning"
summary = "Prepayments above the invoice total, so that the amount due (BT-115) is negative."
basis = """Plausibility: EN 16931 BR-CO-16 (amount due = total - paid amount) holds, but a negative \
amount due asks the seller to pay the difference."""
tests = ["tests/zugferd/validate/test.typ"]
