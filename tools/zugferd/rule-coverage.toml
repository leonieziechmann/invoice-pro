# ======================================================================
# without-fixture: official rule ids of src/ that no fixture shows
# ======================================================================
#
# Every official rule id that a file of src/ names outside the write guard
# (src/zugferd/guard/) has a parity fixture that shows invoice-pro report
# it, or an entry here that says why there is none. An id used for another
# condition than the official rule is a bug: the validators do not report it
# for such an invoice, so no fixture can show it. Fix the id, then remove it
# here (the gate names every entry that no file of src/ names any more).

[[without-fixture]]
ids = ["BR-48"]
reason = """Cannot fire: every VAT constructor states a rate (0 % by default) and the model writes \
the rate of every VAT breakdown. The registry checks it as a model defect and names the input; the \
write guard checks the XML (FX-SCH-A-000050)."""

[[without-fixture]]
ids = ["BR-03"]
reason = """Cannot fire: `invoice` requires `date` to be a datetime, by default the day of the \
compilation."""

[[without-fixture]]
ids = ["BR-09", "BR-11", "BR-20", "BR-57"]
reason = """Cannot fire: a party or delivery address without `country` gets the country of the \
locale, so the country code is never missing."""

[[without-fixture]]
ids = ["BR-CO-04", "BR-DE-30", "PEPPOL-EN16931-R121"]
reason = """Cannot fire: every item has a VAT category (`tax: none` is written as zero rated, with \
IP-TAX-01), `direct-debit` requires the creditor identifier, and `item` and `bundle` refuse a price \
base quantity of 0 or less (see the construction entries of these rules)."""

[[without-fixture]]
ids = [
  "BR-CO-13", "BR-CO-15", "BR-CO-17",
  "BR-S-08", "BR-Z-08", "BR-E-08", "BR-AE-08", "BR-IC-08", "BR-G-08", "BR-O-08", "BR-AF-08", "BR-AG-08",
]
reason = """A safety net that cannot fire: `check-consistency` re-checks the totals and the VAT \
breakdown that the model computes from the lines, allowances and charges it writes; a failure is a \
bug of invoice-pro, which no input shows."""

[[without-fixture]]
ids = [
  "BR-DEC-01", "BR-DEC-05", "BR-DEC-09", "BR-DEC-10", "BR-DEC-11", "BR-DEC-12", "BR-DEC-13", "BR-DEC-14",
  "BR-DEC-16", "BR-DEC-18", "BR-DEC-19", "BR-DEC-20", "BR-DEC-23", "BR-DEC-24", "BR-DEC-27",
]
reason = """Used for another condition: invoice-pro reports an amount with more than 2 decimals \
(e.g. of a currency such as KWD) under these ids, but the builder writes the amounts rounded, so the \
official rules cannot fail: the validators report the sums that no longer add up (e.g. BR-CO-15) or \
nothing (MINIMUM). The guard enforces the decimals of the XML."""

[[without-fixture]]
ids = ["BR-55"]
reason = """Used for another condition: invoice-pro reports a preceding invoice date (BT-26) without \
its number under this id, but the builder writes the preceding invoice reference (BG-3) only with its \
number, so the validators accept the XML (the date is lost)."""

[[without-fixture]]
ids = ["BR-61"]
reason = """Used for another condition: invoice-pro reports a credit transfer without account \
outside XRechnung under this id, but the builder writes no account then, which BR-61 does not test; \
KoSIT reports CII-SR-470 (open), Mustang nothing."""

[[without-fixture]]
ids = ["BR-IC-12", "BR-CO-16"]
reason = """Warnings for other conditions: a deliver-to country of an intra-community supply that \
is the seller's own (the official BR-IC-12 requires a deliver-to country, which the builder always \
writes, so the error of that name cannot fire), and a prepaid amount above the total (the official \
BR-CO-16 is arithmetic that holds by construction)."""

# ======================================================================
# invoice-pro's own rules (IP-*): stricter than the official validators
# ======================================================================
#
# level    "error", "warning" or "error or warning"
# summary  what the rule checks
# basis    the law or the requirement it enforces
# tests    tests that name the rule (the rules of the guard are tested by
#          their kind of finding)

[ip."IP-PROFILE-01"]
level = "warning"
summary = "An input the profile cannot state is printed, but not written into the e-invoice."
basis = "Fidelity: the e-invoice states what the invoice prints, as far as the profile can."
tests = ["tests/zugferd/line-data/test.typ", "tests/zugferd/notes/test.typ"]

[ip."IP-TAX-01"]
level = "error"
summary = "`tax: none` in an e-invoice would declare the items as zero rated (Z)."
basis = "EN 16931 BT-151: every item states its VAT category, a decision the user has to make."
tests = ["tests/zugferd/vat-categories/test.typ", "tools/zugferd/corpus/regression/tax-none.typ"]

[ip."IP-TAX-02"]
level = "error"
summary = "A VAT exemption reason code (BT-121) of another VAT category."
basis = "CEF VATEX code list: each code belongs to a VAT category."
tests = ["tests/zugferd/exemption-codes/test.typ"]

[ip."IP-TAX-03"]
level = "warning"
summary = "Items of one VAT category and rate with different exemption reason codes."
basis = "EN 16931 BG-23: one exemption reason code per VAT group; the others are stated as text."
tests = ["tests/zugferd/exemption-codes/test.typ"]

[ip."IP-TAX-04"]
level = "error"
summary = "An exemption (E) with an exemption reason code but without `grounds` for the printed invoice."
basis = "§ 14 Abs. 4 Satz 1 Nr. 8 UStG; Art. 226 No. 11 of the VAT Directive 2006/112/EC."
tests = ["tests/zugferd/exemption-codes/test.typ"]

[ip."IP-PRINT-02"]
level = "error"
summary = "Amounts printed in another currency than the invoice currency (BT-5)."
basis = "Fidelity: the e-invoice states the amounts the invoice prints, in its currency (Art. 230 VAT Directive)."
tests = ["tests/zugferd/currency/test.typ", "tools/zugferd/corpus/regression/custom-locale-currency-format-only.typ"]

[ip."IP-PRINT-03"]
level = "error"
summary = "The printed invoice shows neither the seller's VAT identifier nor its tax number, which the XML states."
basis = "§ 14 Abs. 4 Satz 1 Nr. 2 UStG; Art. 226 No. 3 of the VAT Directive 2006/112/EC."
tests = ["tests/zugferd/printed/test.typ"]

[ip."IP-PRINT-01"]
level = "error"
summary = "An amount or quantity of the XML differs from the one the invoice prints (a line, an allowance or charge, a VAT group, a total)."
basis = "§ 14 Abs. 4 Satz 1 Nr. 5, 7 and 8 UStG; Art. 226 No. 6 and 8 to 10 of the VAT Directive 2006/112/EC: the XML of a hybrid invoice states the invoice its PDF shows."
tests = ["tests/zugferd/equivalence/test.typ"]

[ip."IP-CALC-01"]
level = "error"
summary = "The parts of a document level allowance or charge per VAT category do not add up to its printed amount, or have the other sign."
basis = "§ 14 Abs. 4 Satz 1 Nr. 7 UStG; Art. 226 No. 8 of the VAT Directive 2006/112/EC (the taxable amount per rate, with its reductions)."
tests = ["tests/zugferd/equivalence/test.typ"]

[ip."IP-CALC-02"]
level = "error"
summary = "The printed lines, allowances and charges of a VAT category do not add up to its printed taxable amount (gross prices: its gross total)."
basis = "§ 14 Abs. 4 Satz 1 Nr. 7 and 8 UStG; Art. 226 No. 8 and 10 of the VAT Directive 2006/112/EC."
tests = ["tests/zugferd/equivalence/test.typ"]

[ip."IP-DOC-01"]
level = "error"
summary = "A subject that names another kind of document than an invoice, without `document-type`."
basis = "EN 16931 BT-3: the document type states what the document is (a commercial invoice asks for payment)."
tests = ["tests/zugferd/document-type/test.typ", "tools/zugferd/corpus/regression/quote-subject.typ"]

[ip."IP-DOC-02"]
level = "error"
summary = "A corrected invoice without `preceding-invoice-nr`."
basis = "Art. 219 of the VAT Directive 2006/112/EC: a corrected invoice refers to the invoice it amends."
tests = ["tests/zugferd/preceding-invoice/test.typ"]

[ip."IP-DOC-03"]
level = "error"
summary = "A credit note with a negative total, which would ask the buyer to pay."
basis = "EN 16931 BT-3 (381): a credit note states the credited amounts as positive amounts."
tests = ["tests/zugferd/document-type/test.typ", "tools/zugferd/corpus/regression/credit-note-negative.typ"]

[ip."IP-DOC-04"]
level = "warning"
summary = "An invoice with a negative total."
basis = "EN 16931 BT-3: a credit note (381) is the document for a credit."
tests = ["tests/zugferd/document-type/test.typ"]

[ip."IP-PERIOD-01"]
level = "error or warning"
summary = "A printed service period that is not the one the XML states."
basis = "§ 14 Abs. 4 Satz 1 Nr. 6 UStG: the date of the supply; the e-invoice states the printed one."
tests = [
  "tests/zugferd/service-period/test.typ",
  "tools/zugferd/corpus/regression/service-period-printed-date-contradicts.typ",
]

[ip."IP-PERIOD-02"]
level = "warning"
summary = "The date of an item outside the `service-period` of the invoice (outside XRechnung)."
basis = "Plausibility; XRechnung checks it as PEPPOL-EN16931-R110 and R111."
tests = ["tests/zugferd/line-data/test.typ"]

[ip."IP-PERIOD-03"]
level = "error or warning"
summary = "The printed invoice does not show the date of the supply."
basis = "§ 14 Abs. 4 Satz 1 Nr. 6 UStG (not for a small-amount invoice, § 33 UStDV)."
tests = ["tests/zugferd/printed/test.typ"]

[ip."IP-COUNTRY-01"]
level = "error"
summary = "A party without `country` whose VAT identifier was issued by another country than the default."
basis = "Fidelity: the country code (BT-40, BT-55) is the party's country, not the locale's."
tests = ["tests/zugferd/parties/test.typ"]

[ip."IP-ADDR-01"]
level = "error"
summary = "A city line with a number but no post code in the format of the party's country."
basis = "Fidelity: the post code (BT-38, BT-53) would be missing and written into the city name."
tests = ["tests/zugferd/parties/test.typ"]

[ip."IP-ID-01"]
level = "error"
summary = "An identifier of the `id` module whose format or check digit is wrong."
basis = "The format and check digits of the identifier schemes (ISO/IEC 6523, Leitweg-ID)."
tests = ["tests/zugferd/identifiers/test.typ", "tools/zugferd/corpus/regression/legal-id-check-digit.typ"]

[ip."IP-ID-02"]
level = "error"
summary = "Two values for one party identifier, of which only one can be written."
basis = "Fidelity: EN 16931 states one identifier per scheme (BT-29, BT-46, BT-71); one value would be lost."
tests = ["tests/zugferd/parties/test.typ"]

[ip."IP-ID-03"]
level = "error"
summary = "An identifier given for a field it does not belong to (e.g. a Leitweg-ID as `legal-id`)."
basis = "The identifier schemes of EN 16931 (BT-10, BT-29, BT-30, BT-46, BT-47)."
tests = ["tests/zugferd/party-details/test.typ"]

[ip."IP-KEY-01"]
level = "warning"
summary = "A key of a party that invoice-pro does not know: its value is not written."
basis = "Fidelity: no input is dropped without notice."
tests = ["tests/zugferd/parties/test.typ"]

[ip."IP-KEY-02"]
level = "error"
summary = "A misspelled key the e-invoice reads, or another name of it (e.g. `vatId`)."
basis = "Fidelity: its value would be missing from the e-invoice without notice."
tests = ["tests/zugferd/parties/test.typ"]

[ip."IP-VAT-226"]
level = "error"
summary = """An intra-community supply (K) or cross-border reverse charge (AE) without the buyer VAT \
identifier the official rules miss, or a tax representative without address."""
basis = "Art. 226 No. 4 and No. 15 of the VAT Directive 2006/112/EC."
tests = ["tests/zugferd/vat-categories/test.typ", "tests/zugferd/parties/test.typ"]

[ip."IP-VAT-138"]
level = "warning"
summary = "An intra-community supply (K) to a buyer whose VAT identifier was not issued by an EU member state."
basis = "Art. 138 of the VAT Directive 2006/112/EC."
tests = ["tests/zugferd/parties/test.typ"]

[ip."IP-UNIT-01"]
level = "warning"
summary = "A unit code used verbatim that is also a common German abbreviation of another unit."
basis = "UN/ECE Recommendation 20: e.g. STK is no code for pieces."
tests = ["tests/zugferd/units/test.typ"]

[ip."IP-DEC-01"]
level = "error"
summary = "A VAT rate with more than 4 decimals, which the XML cannot state exactly."
basis = "Fidelity: EN 16931 states the rate (BT-119, BT-152) as a percentage with up to 4 decimals."
tests = ["tests/zugferd/rates/test.typ"]

[ip."IP-PAY-01"]
level = "error"
summary = "An IBAN with wrong check digits or format, where BR-DE-19 and BR-DE-20 do not check it."
basis = "ISO 13616 (IBAN): the amount could not be paid or collected."
tests = ["tests/zugferd/payment-means/test.typ"]

[ip."IP-PAY-02"]
level = "error"
summary = "A SEPA creditor identifier (BT-90) with wrong check digits or format."
basis = "The EPC's SEPA creditor identifier (ISO 7064 check digits)."
tests = ["tests/zugferd/payment-means/test.typ"]

[ip."IP-PAY-03"]
level = "error"
summary = "Two kinds of payment means that the official rules accept together."
basis = "EN 16931 BG-16: an invoice states one payment means type (BT-81), so that the buyer does not pay twice."
tests = ["tests/zugferd/payment-means/test.typ", "tools/zugferd/corpus/regression/payment-card-and-bank.typ"]

[ip."IP-GUARD-00"]
level = "error"
summary = "Summarizes the guard's findings next to errors of the validator."
basis = "The XML write guard (tools/zugferd/gen_guard.py): the schema and Schematron of the profile."
tests = ["tests/zugferd/guard/test.typ"]

[ip."IP-GUARD-01"]
level = "error"
summary = "An element the profile's schema does not know at its position, or text where it expects elements."
basis = "The XSD of the profile (Factur-X 1.0.07)."
tests = ["tests/zugferd/guard/test.typ", "tools/zugferd/mutate.py"]

[ip."IP-GUARD-02"]
level = "error"
summary = "An element out of the order of the schema."
basis = "The XSD of the profile (Factur-X 1.0.07)."
tests = ["tests/zugferd/guard/test.typ", "tools/zugferd/mutate.py"]

[ip."IP-GUARD-03"]
level = "error"
summary = "An element more often than the schema or the Schematron allows."
basis = "The XSD and Schematron of the profile."
tests = ["tests/zugferd/guard/test.typ", "tools/zugferd/mutate.py"]

[ip."IP-GUARD-04"]
level = "error"
summary = "A required element that is missing or has no text."
basis = "The XSD and Schematron of the profile."
tests = ["tests/zugferd/guard/test.typ", "tools/zugferd/mutate.py"]

[ip."IP-GUARD-05"]
level = "error"
summary = "An element or attribute the Factur-X Schematron of the profile marks as not used."
basis = "The Factur-X 1.0.07 Schematron of the profile (its reports without id)."
tests = ["tests/zugferd/guard/test.typ"]

[ip."IP-GUARD-06"]
level = "error"
summary = "An attribute the schema does not allow, or a required one that is missing."
basis = "The XSD of the profile (Factur-X 1.0.07)."
tests = ["tests/zugferd/guard/test.typ", "tools/zugferd/mutate.py"]

[ip."IP-GUARD-07"]
level = "error"
summary = "A value outside its lexical form or a code outside its list, where no official rule says so."
basis = "The XSD data types and the code lists of the profile."
tests = ["tests/zugferd/guard/test.typ", "tools/zugferd/mutate.py"]

[ip."IP-GUARD-08"]
level = "error"
summary = "A date in the format 102 that names no day of the calendar."
basis = "UNTDID 2379 format 102 (CCYYMMDD)."
tests = ["tests/zugferd/guard/test.typ", "tools/zugferd/mutate.py"]

[ip."IP-GUARD-09"]
level = "error"
summary = "An invalid name, a missing namespace declaration, or not exactly one root element."
basis = "XML 1.0 and Namespaces in XML: the attachment must be well-formed."
tests = ["tests/zugferd/guard/test.typ"]
