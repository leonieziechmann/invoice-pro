"BG-22" = { name = "DOCUMENT TOTALS", disposition = "derived", source = "the totals of the line items, as printed" }
"BT-106" = { name = "Sum of Invoice line net amount", disposition = "derived", source = "the net amounts of the lines" }
"BT-107" = { name = "Sum of allowances on document level", disposition = "derived", source = "the document level allowances (BG-20)" }
"BT-108" = { name = "Sum of charges on document level", disposition = "derived", source = "the document level charges (BG-21)" }
"BT-109" = { name = "Invoice total amount without VAT", disposition = "derived", source = "the printed net total" }
"BT-110" = { name = "Invoice total VAT amount", disposition = "derived", source = "the VAT amounts of the VAT breakdown (BG-23)" }
"BT-111" = { name = "Invoice total VAT amount in accounting currency", disposition = "unsupported", reason = "no VAT accounting currency (BT-6)" }
"BT-112" = { name = "Invoice total amount with VAT", disposition = "derived", source = "the printed gross total" }
"BT-113" = { name = "Paid amount", disposition = "input", input = "prepayment, or paid (the total)" }
"BT-114" = { name = "Rounding amount", disposition = "unsupported", reason = "amounts are not rounded to a payable amount" }
