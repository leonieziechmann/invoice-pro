"BT-93" = { name = "Document level allowance base amount", disposition = "unsupported", reason = "a percentage discount is stated by its amount (BT-92); its base is not stated yet" }
"BT-94" = { name = "Document level allowance percentage", disposition = "unsupported", reason = "a percentage discount is stated by its amount (BT-92); its percentage is not stated yet" }
