# What invoice-pro does with every business term of EN 16931-1 (the semantic
# model of the European e-invoice), checked by tools/zugferd/bt_disposition.py.
#
# Every business term (BT-1 to BT-165; BT-4 is not defined) and every business
# group (BG-1 to BG-32) has one entry with its EN 16931 `name` and its
# `disposition`:
#
#   "input"        an input of invoice-pro states it; `input` names the input
#                  (a parameter of `invoice`, a key of a party dictionary, a
#                  component or one of its arguments)
#   "derived"      invoice-pro derives it; `source` says from what
#   "unsupported"  invoice-pro does not state it; `reason` says why
#
# and optionally a `note`. The scheme identifiers of identifiers (BT-29-1,
# BT-30-1, BT-34-1, ...) share the disposition of their business term.
#
# The check fails when a business term has no entry, so every term needs a
# decision: a value that has no input of its own cannot end up in the wrong
# business term unnoticed (issue #42). A new input updates the entry of its
# business term in the same change. Which profile states which term is
# decided by the Factur-X schemas (src/zugferd/profile.typ); an input a
# profile cannot state is reported as a warning (IP-PROFILE-01).

[terms]
# ---------------------------------------------------------------- Invoice (BG-0)
"BT-1" = { name = "Invoice number", disposition = "input", input = "invoice-nr" }
"BT-2" = { name = "Invoice issue date", disposition = "input", input = "date" }
"BT-3" = { name = "Invoice type code", disposition = "input", input = "document-type (a named type such as \"credit-note\", or a UNTDID 1001 code)", note = "380 (commercial invoice) without document-type" }
"BT-5" = { name = "Invoice currency code", disposition = "input", input = "currency, else the currency code of the locale (`locale`, region currency)" }
"BT-6" = { name = "VAT accounting currency code", disposition = "unsupported", reason = "the VAT is stated in the invoice currency; a separate VAT accounting currency is not supported" }
"BT-7" = { name = "Value added tax point date", disposition = "unsupported", reason = "the tax point is stated by the actual delivery date (BT-72) or the invoicing period (BG-14)" }
"BT-8" = { name = "Value added tax point date code", disposition = "unsupported", reason = "the tax point is stated by the actual delivery date (BT-72) or the invoicing period (BG-14)" }
"BT-9" = { name = "Payment due date", disposition = "input", input = "due-date (a date), payment-goal(date:) or payment-goal(days:)" }
"BT-10" = { name = "Buyer reference", disposition = "input", input = "recipient.buyer-reference or recipient.leitweg-id (text or id.leitweg(..))" }
"BT-11" = { name = "Project reference", disposition = "input", input = "project", note = "EN 16931 and XRechnung only" }
"BT-12" = { name = "Contract reference", disposition = "input", input = "contract-nr (or recipient.contract-nr)" }
"BT-13" = { name = "Purchase order reference", disposition = "input", input = "order-nr (or recipient.order-nr, po-nr)" }
"BT-14" = { name = "Sales order reference", disposition = "unsupported", reason = "no input for the seller's own order number" }
"BT-15" = { name = "Receiving advice reference", disposition = "unsupported", reason = "no input; receiving advices are documents of the buyer" }
"BT-16" = { name = "Despatch advice reference", disposition = "input", input = "delivery-note-nr (or recipient.delivery-note-nr)" }
"BT-17" = { name = "Tender or lot reference", disposition = "unsupported", reason = "no input for public procurement references" }
"BT-18" = { name = "Invoiced object identifier", disposition = "unsupported", reason = "no input for invoiced objects (e.g. subscriptions, meters)" }
"BT-19" = { name = "Buyer accounting reference", disposition = "unsupported", reason = "no input for the buyer's booking account" }
"BT-20" = { name = "Payment terms", disposition = "input", input = "payment-goal (its text), due-date (a text) or paid (the printed sentence)" }
# ---------------------------------------------------------------- BG-1 Invoice note
"BG-1" = { name = "INVOICE NOTE", disposition = "input", input = "notes" }
"BT-21" = { name = "Invoice note subject code", disposition = "input", input = "notes (subject-code of a note)" }
"BT-22" = { name = "Invoice note", disposition = "input", input = "notes (the text of a note)" }
# ---------------------------------------------------------------- BG-2 Process control
"BG-2" = { name = "PROCESS CONTROL", disposition = "derived", source = "the profile (`zugferd`)" }
"BT-23" = { name = "Business process type", disposition = "derived", source = "the Peppol billing process for the EN 16931 and XRechnung profiles" }
"BT-24" = { name = "Specification identifier", disposition = "derived", source = "the guideline of the profile (`zugferd`)" }
# ---------------------------------------------------------------- BG-3 Preceding invoice reference
"BG-3" = { name = "PRECEDING INVOICE REFERENCE", disposition = "input", input = "preceding-invoice-nr" }
"BT-25" = { name = "Preceding Invoice reference", disposition = "input", input = "preceding-invoice-nr" }
"BT-26" = { name = "Preceding Invoice issue date", disposition = "input", input = "preceding-invoice-date" }
# ---------------------------------------------------------------- BG-4 Seller
"BG-4" = { name = "SELLER", disposition = "input", input = "sender" }
"BT-27" = { name = "Seller name", disposition = "input", input = "sender.name" }
"BT-28" = { name = "Seller trading name", disposition = "input", input = "sender.trading-name" }
"BT-29" = { name = "Seller identifier", disposition = "input", input = "sender.id, sender.global-id (text or an identifier of the `id` module)", note = "without an identifier, legal registration or VAT identifier, the tax number (sender.tax-nr) identifies the seller (BR-CO-26)" }
"BT-30" = { name = "Seller legal registration identifier", disposition = "input", input = "sender.legal-id (text or an identifier of the `id` module)" }
"BT-31" = { name = "Seller VAT identifier", disposition = "input", input = "sender.vat-id", note = "left out when the invoice is not subject to VAT (BR-O-02)" }
"BT-32" = { name = "Seller tax registration identifier", disposition = "input", input = "sender.tax-nr" }
"BT-33" = { name = "Seller additional legal information", disposition = "input", input = "sender.legal-info" }
"BT-34" = { name = "Seller electronic address", disposition = "input", input = "sender.electronic-address", note = "without one, derived from sender.vat-id or the email address" }
# ---------------------------------------------------------------- BG-5 Seller postal address
"BG-5" = { name = "SELLER POSTAL ADDRESS", disposition = "input", input = "sender.address, sender.city, sender.country" }
"BT-35" = { name = "Seller address line 1", disposition = "input", input = "sender.address (first line)" }
"BT-36" = { name = "Seller address line 2", disposition = "input", input = "sender.address (second line)" }
"BT-162" = { name = "Seller address line 3", disposition = "input", input = "sender.address (further lines)" }
"BT-37" = { name = "Seller city", disposition = "input", input = "sender.city (the city name)" }
"BT-38" = { name = "Seller post code", disposition = "input", input = "sender.city (the post code)" }
"BT-39" = { name = "Seller country subdivision", disposition = "input", input = "sender.city (the state of a city dictionary or of a US city line)" }
"BT-40" = { name = "Seller country code", disposition = "input", input = "sender.country", note = "without one, the country of the locale region" }
# ---------------------------------------------------------------- BG-6 Seller contact
"BG-6" = { name = "SELLER CONTACT", disposition = "input", input = "sender.contact" }
"BT-41" = { name = "Seller contact point", disposition = "input", input = "sender.contact.name (or sender.contact-name)" }
"BT-42" = { name = "Seller contact telephone number", disposition = "input", input = "sender.contact.phone (or sender.phone)" }
"BT-43" = { name = "Seller contact email address", disposition = "input", input = "sender.contact.email (or sender.email)" }
# ---------------------------------------------------------------- BG-7 Buyer
"BG-7" = { name = "BUYER", disposition = "input", input = "recipient" }
"BT-44" = { name = "Buyer name", disposition = "input", input = "recipient.name" }
"BT-45" = { name = "Buyer trading name", disposition = "input", input = "recipient.trading-name" }
"BT-46" = { name = "Buyer identifier", disposition = "input", input = "recipient.id or recipient.global-id (text or an identifier of the `id` module)" }
"BT-47" = { name = "Buyer legal registration identifier", disposition = "input", input = "recipient.legal-id (text or an identifier of the `id` module)" }
"BT-48" = { name = "Buyer VAT identifier", disposition = "input", input = "recipient.vat-id", note = "left out when the invoice is not subject to VAT (BR-O-02)" }
"BT-49" = { name = "Buyer electronic address", disposition = "input", input = "recipient.electronic-address (e.g. id.leitweg(..))", note = "without one, derived from recipient.vat-id or the email address" }
# ---------------------------------------------------------------- BG-8 Buyer postal address
"BG-8" = { name = "BUYER POSTAL ADDRESS", disposition = "input", input = "recipient.address, recipient.city, recipient.country" }
"BT-50" = { name = "Buyer address line 1", disposition = "input", input = "recipient.address (first line)" }
"BT-51" = { name = "Buyer address line 2", disposition = "input", input = "recipient.address (second line)" }
"BT-163" = { name = "Buyer address line 3", disposition = "input", input = "recipient.address (further lines)" }
"BT-52" = { name = "Buyer city", disposition = "input", input = "recipient.city (the city name)" }
"BT-53" = { name = "Buyer post code", disposition = "input", input = "recipient.city (the post code)" }
"BT-54" = { name = "Buyer country subdivision", disposition = "input", input = "recipient.city (the state of a city dictionary or of a US city line)" }
"BT-55" = { name = "Buyer country code", disposition = "input", input = "recipient.country", note = "without one, the country of the locale region" }
# ---------------------------------------------------------------- BG-9 Buyer contact
"BG-9" = { name = "BUYER CONTACT", disposition = "input", input = "recipient.contact (or recipient.contact-name, recipient.phone)", note = "an email address alone is no contact point: it can be the electronic address (BT-49)" }
"BT-56" = { name = "Buyer contact point", disposition = "input", input = "recipient.contact.name (or recipient.contact-name)" }
"BT-57" = { name = "Buyer contact telephone number", disposition = "input", input = "recipient.contact.phone (or recipient.phone)" }
"BT-58" = { name = "Buyer contact email address", disposition = "input", input = "recipient.contact.email (or recipient.email)" }
# ---------------------------------------------------------------- BG-10 Payee
"BG-10" = { name = "PAYEE", disposition = "input", input = "payee" }
"BT-59" = { name = "Payee name", disposition = "input", input = "payee.name" }
"BT-60" = { name = "Payee identifier", disposition = "input", input = "payee.id or payee.global-id (text or an identifier of the `id` module)" }
"BT-61" = { name = "Payee legal registration identifier", disposition = "input", input = "payee.legal-id (text or an identifier of the `id` module)" }
# ---------------------------------------------------------------- BG-11 Seller tax representative party
"BG-11" = { name = "SELLER TAX REPRESENTATIVE PARTY", disposition = "input", input = "sender.tax-representative" }
"BT-62" = { name = "Seller tax representative name", disposition = "input", input = "sender.tax-representative.name" }
"BT-63" = { name = "Seller tax representative VAT identifier", disposition = "input", input = "sender.tax-representative.vat-id" }
# ---------------------------------------------------------------- BG-12 Seller tax representative postal address
"BG-12" = { name = "SELLER TAX REPRESENTATIVE POSTAL ADDRESS", disposition = "input", input = "sender.tax-representative.address, .city, .country" }
"BT-64" = { name = "Tax representative address line 1", disposition = "input", input = "sender.tax-representative.address (first line)" }
"BT-65" = { name = "Tax representative address line 2", disposition = "input", input = "sender.tax-representative.address (second line)" }
"BT-164" = { name = "Tax representative address line 3", disposition = "input", input = "sender.tax-representative.address (further lines)" }
"BT-66" = { name = "Tax representative city", disposition = "input", input = "sender.tax-representative.city (the city name)" }
"BT-67" = { name = "Tax representative post code", disposition = "input", input = "sender.tax-representative.city (the post code)" }
"BT-68" = { name = "Tax representative country subdivision", disposition = "input", input = "sender.tax-representative.city (the state of a city dictionary or of a US city line)" }
"BT-69" = { name = "Tax representative country code", disposition = "input", input = "sender.tax-representative.country", note = "without one, the country of the locale region" }
# ---------------------------------------------------------------- BG-13 Delivery information
"BG-13" = { name = "DELIVERY INFORMATION", disposition = "input", input = "delivery-address (or recipient.delivery-address)", note = "an intra-community supply without delivery address states the buyer's address (BR-IC-12)" }
"BT-70" = { name = "Deliver to party name", disposition = "input", input = "delivery-address.name" }
"BT-71" = { name = "Deliver to location identifier", disposition = "input", input = "delivery-address.id, .location-id or .global-id" }
"BT-72" = { name = "Actual delivery date", disposition = "derived", source = "service-period (a date), else the date of the items (`date` of `item`, `bundle`, `group`) when they share one, else the invoice date", note = "a credit note without service-period and dates states none: its own date is not the date of the supply" }
# ---------------------------------------------------------------- BG-14 Invoicing period
"BG-14" = { name = "DELIVERY OR INVOICE PERIOD", disposition = "derived", source = "service-period (a period), else the dates of the items (`date` of `item`, `bundle`, `group`) when they span a period" }
"BT-73" = { name = "Invoicing period start date", disposition = "derived", source = "the earliest date of the items" }
"BT-74" = { name = "Invoicing period end date", disposition = "derived", source = "the latest date of the items" }
# ---------------------------------------------------------------- BG-15 Deliver to address
"BG-15" = { name = "DELIVER TO ADDRESS", disposition = "input", input = "delivery-address.address, .city, .country" }
"BT-75" = { name = "Deliver to address line 1", disposition = "input", input = "delivery-address.address (first line)" }
"BT-76" = { name = "Deliver to address line 2", disposition = "input", input = "delivery-address.address (second line)" }
"BT-165" = { name = "Deliver to address line 3", disposition = "input", input = "delivery-address.address (further lines)" }
"BT-77" = { name = "Deliver to city", disposition = "input", input = "delivery-address.city (the city name)" }
"BT-78" = { name = "Deliver to post code", disposition = "input", input = "delivery-address.city (the post code)" }
"BT-79" = { name = "Deliver to country subdivision", disposition = "input", input = "delivery-address.city (the state of a city dictionary or of a US city line)" }
"BT-80" = { name = "Deliver to country code", disposition = "input", input = "delivery-address.country", note = "without one, the country of the recipient" }
# ---------------------------------------------------------------- BG-16 Payment instructions
"BG-16" = { name = "PAYMENT INSTRUCTIONS", disposition = "input", input = "bank-details, direct-debit, card-payment or paid" }
"BT-81" = { name = "Payment means type code", disposition = "derived", source = "the payment means component: bank-details 58 (SEPA credit transfer) in euro, 30 otherwise; direct-debit 59 or 49; card-payment 54, 55 or 48; paid(method:) the code of its method, e.g. 10 for cash" }
"BT-82" = { name = "Payment means text", disposition = "unsupported", reason = "the payment means code (BT-81) says it; no input for a text" }
"BT-83" = { name = "Remittance information", disposition = "input", input = "bank-details(reference:, text:), payment-reference or invoice-nr" }
# ---------------------------------------------------------------- BG-17 Credit transfer
"BG-17" = { name = "CREDIT TRANSFER", disposition = "input", input = "bank-details" }
"BT-84" = { name = "Payment account identifier", disposition = "input", input = "bank-details(iban:)" }
"BT-85" = { name = "Payment account name", disposition = "input", input = "bank-details(name:)", note = "only an explicit name: the default account holder, the payee or the seller, is named by BT-59 or BT-27" }
"BT-86" = { name = "Payment service provider identifier", disposition = "input", input = "bank-details(bic:)" }
# ---------------------------------------------------------------- BG-18 Payment card information
"BG-18" = { name = "PAYMENT CARD INFORMATION", disposition = "input", input = "card-payment" }
"BT-87" = { name = "Payment card primary account number", disposition = "input", input = "card-payment(last4:)" }
"BT-88" = { name = "Payment card holder name", disposition = "input", input = "card-payment(holder:)" }
# ---------------------------------------------------------------- BG-19 Direct debit
"BG-19" = { name = "DIRECT DEBIT", disposition = "input", input = "direct-debit" }
"BT-89" = { name = "Mandate reference identifier", disposition = "input", input = "direct-debit(mandate:)" }
"BT-90" = { name = "Bank assigned creditor identifier", disposition = "input", input = "direct-debit(creditor-id:)" }
"BT-91" = { name = "Debited account identifier", disposition = "input", input = "direct-debit(debtor-iban:)" }
