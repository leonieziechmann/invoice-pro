"BT-97" = { name = "Document level allowance reason", disposition = "input", input = "the name of the discount (\"Discount\" without one)" }
"BT-98" = { name = "Document level allowance reason code", disposition = "unsupported", reason = "no input for UNTDID 5189 reason codes" }
# ---------------------------------------------------------------- BG-21 Document level charges
