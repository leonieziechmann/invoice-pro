# Known failures of the e-invoice conformance corpus (tools/zugferd/run.py).
#
# Every entry names the audit finding (or issue) and the failure signatures it
# explains, as the runner prints them under NEW FAILURES. A failing case whose
# signature is listed here does not fail the run. `cases` (glob patterns of
# case ids) and `features` (values of the generator's dimensions, e.g.
# `{ delivery = "dates-mixed" }`, a value or a list of values each) narrow an
# entry to the cases that reproduce it; keep entries that narrow, so that
# they cannot hide the same signature elsewhere.
#
# The list may only shrink: an entry that matches no failing case any more
# ("XPASS") fails the run, so the fix removes its entry in the same commit.
# Adding an entry needs a finding or issue that is being worked on; it never
# hides a new class of failure. No entry excuses a legal invoice that is not
# AGREE_VALID (the hard gate); only oracle failures of legal invoices can be
# known issues. `run.py --strict` ignores this file.
#
# Entries look like this:
#
#   [[issue]]
#   finding = "amounts-delivery-date-mismatch"
#   note = "BG-14 counts undated items with the invoice date"
#   features = { delivery = "dates-mixed" }
#   signatures = ["AGREE_VALID oracle=O-BG14"]
#
# There are none at the moment.
